<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Conheça a VETRIX, uma proposta de aplicativo que une tecnologia, carinho e cuidado animal.">

    <title>VETRIX | O amanhã também tem patas</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* DESTAQUE PRINCIPAL */
        .inicio-destaque {
            min-height: 570px;
            display: flex;
            align-items: center;
            padding: 65px 7%;
            background-image:
                linear-gradient(
                    90deg,
                    rgba(17, 54, 44, 0.88) 0%,
                    rgba(17, 54, 44, 0.62) 48%,
                    rgba(17, 54, 44, 0.12) 100%
                ),
                url("https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=2000&q=90");
            background-size: cover;
            background-position: center;
            color: white;
        }

        .inicio-conteudo {
            max-width: 700px;
        }

        .etiqueta {
            display: inline-block;
            background: #d9f3e9;
            color: #244c43;
            padding: 8px 15px;
            border-radius: 25px;
            font-weight: bold;
            margin-bottom: 22px;
        }

        .inicio-destaque h1 {
            font-size: clamp(40px, 6vw, 68px);
            line-height: 1.08;
            margin-bottom: 22px;
        }

        .inicio-destaque h1 span {
            color: #f5b8a5;
        }

        .inicio-destaque p {
            font-size: 20px;
            max-width: 580px;
            margin-bottom: 15px;
        }

        /* BOTÕES DO DESTAQUE */
        .botoes-inicio {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }

        .botao-claro {
            display: inline-block;
            background: #fff0e8;
            color: #244c43;
            text-decoration: none;
            padding: 14px 23px;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .botao-claro:hover {
            background: #f5b8a5;
            transform: translateY(-3px);
        }

        .botao-contorno {
            display: inline-block;
            color: white;
            border: 2px solid white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .botao-contorno:hover {
            background: white;
            color: #244c43;
        }

        /* BENEFÍCIOS */
        .faixa-beneficios {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            margin: 25px 0 40px;
        }

        .beneficio {
            background: white;
            padding: 25px 20px;
            border-radius: 18px;
            border-bottom: 5px solid #078f83;
            box-shadow: 0 5px 18px #244c4310;
            transition: 0.3s;
        }

        .beneficio:hover {
            transform: translateY(-5px);
        }

        .beneficio .emoji {
            font-size: 35px;
        }

        .beneficio h3 {
            margin: 8px 0;
            color: #078f83;
        }

        /* APRESENTAÇÃO DO APLICATIVO */
        .chamada-app {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 25px;
            align-items: center;
            background: #d9f3e9;
            padding: 35px;
            border-radius: 25px;
            margin: 35px 0;
        }

        .chamada-app h2 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .chamada-visual {
            background: #fff0e8;
            border-radius: 22px;
            padding: 25px;
            text-align: center;
            font-size: 55px;
        }

        .chamada-visual p {
            color: #244c43;
            font-size: 17px;
            font-weight: bold;
            margin-top: 10px;
        }

        /* ETAPAS */
        .passos {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            margin-top: 25px;
        }

        .passo {
            padding: 22px;
            border-radius: 16px;
            background: #fff0e8;
        }

        .passo strong {
            display: block;
            font-size: 26px;
            color: #078f83;
            margin-bottom: 8px;
        }

        /* CHAMADA FINAL */
        .frase-final {
            text-align: center;
            padding: 55px 20px;
            background: #244c43;
            color: white;
        }

        .frase-final h2 {
            font-size: clamp(28px, 4vw, 42px);
            margin-bottom: 12px;
        }

        .frase-final p {
            font-size: 18px;
            margin-bottom: 15px;
        }

        /* ADAPTAÇÃO PARA CELULAR */
        @media (max-width: 700px) {
            .inicio-destaque {
                min-height: 540px;
                padding: 45px 6%;
                background-position: 63% center;
            }

            .inicio-destaque p {
                font-size: 17px;
            }

            .faixa-beneficios,
            .passos,
            .chamada-app {
                grid-template-columns: 1fr;
            }

            .chamada-app {
                padding: 24px;
            }

            .botoes-inicio {
                flex-direction: column;
                align-items: flex-start;
            }

            .botoes-inicio a {
                text-align: center;
            }
        }
    </style>
</head>
